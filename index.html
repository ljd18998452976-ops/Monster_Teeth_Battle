<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monster Teeth Battle｜回合防护版</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#213047;--muted:#6d7b8d;--line:#cbd6e3;--blue:#2458e6;--purple:#9827c9;--orange:#ff8a3d;--yellow:#ffc85c;--red:#ef5350;--green:#42b66b;--shadow:0 5px 0 rgba(139,154,174,.45)}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;color:var(--ink);background:linear-gradient(180deg,#f5f7fb,#e9eef5)}button,input,select{font:inherit}button{border:0;cursor:pointer;transition:.14s transform,.14s filter}button:hover{filter:brightness(1.03);transform:translateY(-1px)}button:active{transform:translateY(1px)}
.app{max-width:1500px;margin:0 auto;padding:18px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:22px;padding:14px 18px;margin-bottom:14px;box-shadow:0 6px 18px rgba(33,48,71,.08)}.title{display:flex;align-items:center;gap:12px}.logo{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--orange),var(--yellow));font-size:34px}h1{font-size:25px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:4px}.topBtns{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}.btn{border-radius:16px;padding:11px 16px;font-weight:900;background:#fff;border:2px solid var(--line);color:var(--ink);box-shadow:0 4px 0 rgba(139,154,174,.35)}.btn.main{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;border-color:#1c4ad0}.btn.red{background:#fff0f0;color:#c64040;border-color:#ffcaca}.btn.green{background:#effff3;color:#21733d;border-color:#ccefd5}.btn.blue{background:#edf5ff;color:#1e63c7;border-color:#c9def8}
.selectPanel{background:#eef2f7;border:2px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px}.selectedLine{font-size:21px;font-weight:900;color:#1d52e2;margin:0 0 12px;letter-spacing:.2px}.nameGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:14px}.nameBtn{min-height:62px;border-radius:20px;background:#fff;color:#213047;border:2px solid #c8d5e3;box-shadow:var(--shadow);font-size:19px;font-weight:900;padding:10px}.nameBtn.active{color:#fff;background:linear-gradient(135deg,#255be8 0%,#8e27cf 100%);border-color:#164bc8;box-shadow:0 5px 0 #15508f}.nameBtn.out{opacity:.45}.quickBar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:2px solid var(--line);border-radius:22px;padding:12px 14px;box-shadow:0 6px 16px rgba(33,48,71,.08)}.tip{color:#8a5a25;background:#fff5df;border:1px solid #efd9a8;border-radius:999px;font-weight:900;font-size:13px;padding:8px 13px}
.battleScreen{display:none;min-height:100vh;background:linear-gradient(180deg,#f6f8fc,#e9eef5)}.battleScreen.show{display:block}.battleTop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:#fff;border-bottom:2px solid var(--line);box-shadow:0 6px 18px rgba(33,48,71,.09)}.battleTitle{display:flex;align-items:center;gap:10px;font-weight:900;font-size:23px;color:#1d52e2}.battleBtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.attackerBar{margin:12px 16px 10px;padding:15px 18px;border-radius:24px;border:3px solid #1c4ad0;background:linear-gradient(135deg,#2458e6,#9827c9);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:14px;box-shadow:0 8px 0 #15508f}.attackerText{font-size:34px;font-weight:1000;line-height:1.05;letter-spacing:.3px}.attackerSub{font-size:14px;opacity:.92;margin-top:4px;font-weight:800}.skipBtn{background:#fff;color:#1d52e2;border-radius:18px;padding:13px 20px;font-size:18px;font-weight:1000;box-shadow:0 5px 0 rgba(0,0,0,.16)}
.battleStats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px 10px}.stat{background:#fff;border:2px solid var(--line);border-radius:18px;padding:8px;text-align:center;box-shadow:0 5px 12px rgba(33,48,71,.08)}.stat b{font-size:25px;display:block}.stat span{font-size:12px;color:var(--muted);font-weight:800}
.battleGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;padding:0 16px 18px}.battleGrid.few{grid-template-columns:repeat(auto-fit,minmax(430px,1fr))}.battleGrid.one{grid-template-columns:minmax(520px,900px);justify-content:center}.card{border:2px solid var(--line);border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 7px 0 rgba(139,154,174,.35);position:relative}.card.out{opacity:.55;filter:saturate(.55)}.card.attacker{outline:5px solid rgba(36,88,230,.28);transform:scale(1.015);z-index:2;box-shadow:0 0 0 7px rgba(152,39,201,.13),0 9px 0 rgba(21,80,143,.55)}.card.protect{outline:5px solid rgba(66,182,107,.25)}
.cardName{padding:12px 14px;font-size:22px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:8px;background:linear-gradient(180deg,#fff,#f7faff)}.cardName span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badges{display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}.count,.shield,.streak{font-size:14px;border-radius:999px;padding:6px 10px;background:#edf5ff;border:1px solid #d2e4f8;white-space:nowrap}.shield{background:#effff3;border-color:#ccefd5;color:#21733d}.streak{background:#fff5df;border-color:#efd9a8;color:#8a5a25}
.monsterBox{height:250px;margin:0 12px 10px;border-radius:22px;position:relative;overflow:hidden;background:linear-gradient(180deg,#fff2df,#ffe2bf)}.monster{position:absolute;width:218px;height:202px;left:50%;top:24px;transform:translateX(-50%);background:var(--c);border-radius:46% 46% 40% 40%;border:7px solid rgba(33,48,71,.13);box-shadow:inset 0 -18px 0 rgba(0,0,0,.08),0 12px 24px rgba(33,48,71,.13)}.horn{position:absolute;top:-18px;width:48px;height:48px;background:#ffe06f;border-radius:11px 31px 11px 31px;border:4px solid rgba(33,48,71,.12)}.horn.l{left:39px;transform:rotate(-22deg)}.horn.r{right:39px;transform:rotate(22deg)}.eye{position:absolute;top:60px;width:43px;height:43px;background:#fff;border-radius:50%}.eye.l{left:55px}.eye.r{right:55px}.eye:after{content:"";position:absolute;width:16px;height:16px;left:14px;top:14px;background:#213047;border-radius:50%}.mouth{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);width:165px;min-height:78px;background:#37221e;border-radius:26px 26px 42px 42px;display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-content:flex-start;padding:8px 12px}.tooth{width:25px;height:33px;background:#fff;border-radius:4px 4px 13px 13px;border:1px solid rgba(0,0,0,.08);box-shadow:inset 0 -4px 0 rgba(0,0,0,.06);cursor:pointer}.tooth:hover{transform:translateY(-2px);filter:brightness(.98)}.tooth.gone{visibility:hidden;pointer-events:none}.sleep{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-5deg);background:rgba(33,48,71,.9);color:#fff;font-size:24px;font-weight:900;padding:10px 18px;border-radius:18px}.card.out .sleep{display:block}.protectLabel{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-4deg);background:rgba(33,151,77,.92);color:#fff;font-size:23px;font-weight:1000;padding:11px 18px;border-radius:18px;z-index:3}.card.protect .protectLabel{display:block}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;padding:0 12px 12px}.smallBtn{border-radius:14px;padding:12px 4px;font-size:15px;font-weight:900;background:#fff;border:2px solid var(--line);color:var(--ink)}.smallBtn.fix{background:#effff1;color:#267b37;border-color:#cff1d2}.smallBtn.revive{background:#edf5ff;color:#1e63c7;border-color:#c9def8}
.battleGrid.few .monsterBox{height:310px}.battleGrid.few .monster{width:278px;height:256px;top:30px;border-width:8px}.battleGrid.few .horn{width:56px;height:56px;top:-20px}.battleGrid.few .horn.l{left:53px}.battleGrid.few .horn.r{right:53px}.battleGrid.few .eye{width:52px;height:52px;top:72px}.battleGrid.few .eye.l{left:73px}.battleGrid.few .eye.r{right:73px}.battleGrid.few .eye:after{width:19px;height:19px;left:17px;top:17px}.battleGrid.few .mouth{width:210px;min-height:98px;bottom:38px;gap:6px;padding:10px 15px;border-radius:30px 30px 48px 48px}.battleGrid.few .tooth{width:32px;height:41px;border-radius:5px 5px 16px 16px}.battleGrid.one .monsterBox{height:430px}.battleGrid.one .monster{width:390px;height:360px;top:38px;border-width:10px}.battleGrid.one .horn{width:76px;height:76px;top:-27px}.battleGrid.one .horn.l{left:82px}.battleGrid.one .horn.r{right:82px}.battleGrid.one .eye{width:70px;height:70px;top:104px}.battleGrid.one .eye.l{left:107px}.battleGrid.one .eye.r{right:107px}.battleGrid.one .eye:after{width:25px;height:25px;left:23px;top:23px}.battleGrid.one .mouth{width:296px;min-height:140px;bottom:52px;gap:9px;padding:14px 22px;border-radius:42px 42px 68px 68px}.battleGrid.one .tooth{width:45px;height:58px;border-radius:6px 6px 22px 22px}
.empty{padding:52px 12px;text-align:center;border:2px dashed #cbd6e3;border-radius:20px;background:#f8fbff;color:var(--muted);font-weight:900;margin:16px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);background:#213047;color:#fff;padding:13px 18px;border-radius:999px;font-weight:900;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.22);transition:.2s}.toast.show{transform:translateX(-50%) translateY(0)}.hide{display:none!important}
@media(max-width:1100px){.nameGrid{grid-template-columns:repeat(5,1fr)}}@media(max-width:780px){.header{flex-direction:column;align-items:flex-start}.nameGrid{grid-template-columns:repeat(2,1fr)}.battleStats{grid-template-columns:repeat(2,1fr)}.battleGrid,.battleGrid.few,.battleGrid.one{grid-template-columns:1fr}.battleGrid.few .monsterBox,.battleGrid.one .monsterBox{height:290px}.battleGrid.few .monster,.battleGrid.one .monster{width:250px;height:230px;top:30px}.attackerText{font-size:25px}}
@media print{body{background:#fff}#selectScreen,.battleTop,.attackerBar,.battleStats,.actions,.toast{display:none!important}#battleScreen{display:block!important;background:#fff}.battleGrid,.battleGrid.few,.battleGrid.one{grid-template-columns:repeat(2,1fr);gap:10px;padding:0}.card{box-shadow:none;break-inside:avoid;border-color:#aaa}.monsterBox{height:230px!important}.monster{width:200px!important;height:185px!important;top:24px!important;border-width:6px!important}.horn{width:42px!important;height:42px!important;top:-16px!important}.horn.l{left:38px!important}.horn.r{right:38px!important}.eye{width:38px!important;height:38px!important;top:55px!important}.eye.l{left:52px!important}.eye.r{right:52px!important}.eye:after{width:14px!important;height:14px!important;left:12px!important;top:12px!important}.mouth{width:154px!important;min-height:72px!important;bottom:30px!important;gap:5px!important;padding:7px 10px!important}.tooth{width:23px!important;height:30px!important}}
</style>
</head>
<body>
<div id="selectScreen" class="app">
  <div class="header"><div class="title"><div class="logo">🦷</div><div><h1>Monster Teeth Battle</h1><div class="sub">先选择本轮PK小朋友，再进入大屏PK页面</div></div></div><div class="topBtns"><button class="btn main" onclick="startBattle()">开始PK</button><button class="btn blue" onclick="addKid()">＋ 加娃</button><button class="btn" onclick="selectAll()">全选</button><button class="btn" onclick="selectNone()">清空选择</button><button class="btn red" onclick="resetNames()">恢复默认名单</button></div></div>
  <section class="selectPanel"><div id="selectedLine" class="selectedLine">已选择 0 人：</div><div id="nameGrid" class="nameGrid"></div></section>
  <section class="quickBar"><div class="tip">进入PK后：轮到谁攻击会在上方放大提示；点击目标怪兽牙齿即可打掉。</div><button class="btn main" onclick="startBattle()">进入PK页面</button></section>
</div>
<div id="battleScreen" class="battleScreen">
  <div class="battleTop"><div class="battleTitle">🦷 Monster Teeth Battle｜PK中</div><div class="battleBtns"><button class="btn green" onclick="restoreSelected()">本轮满牙</button><button class="btn blue" onclick="window.print()">打印怪兽卡</button><button class="btn" onclick="backSelect()">返回选人</button></div></div>
  <div class="attackerBar"><div><div id="attackerText" class="attackerText">轮到：-- 攻击</div><div class="attackerSub">点击目标怪兽的牙齿即可攻击。不能连续攻击同一个目标。</div></div><button class="skipBtn" onclick="nextAttacker()">跳过 / 换下一个</button></div>
  <div class="battleStats"><div class="stat"><b id="statSelected">0</b><span>本轮PK</span></div><div class="stat"><b id="statAlive">0</b><span>还活着</span></div><div class="stat"><b id="statOut">0</b><span>Sleep Mode</span></div><div class="stat"><b id="statTeeth">0</b><span>剩余牙齿</span></div></div>
  <div id="battleGrid" class="battleGrid"></div><div id="battleEmpty" class="empty">还没有选择本轮PK的小朋友，请返回选人。</div>
</div>
<div id="toast" class="toast"></div>
<script>
const defaultNames=["Rocket","Cassie","Rachel","Bobo","Hannah","Cici","Joe","Leon","Sylvia","Gorman","Ryan","Aaron","Annie","Yuki","Linna","Helen","Ken","Charlie","Via","Eva","Zoey"];
const colors=["#82d8ff","#95e27a","#ffb3c7","#c8a6ff","#ffd166","#80ed99","#ff9f7a","#a0c4ff","#f4a261","#b8f2e6","#ffcad4","#caffbf"];
let students=[];let attackerIndex=0;
function makeStudent(name,i,active=false){return{id:Math.random().toString(36).slice(2,9),name,active,max:10,teeth:10,color:colors[i%colors.length],hitStreak:0,protect:false,lastTargetId:null}}
function load(){try{students=JSON.parse(localStorage.getItem("monsterTeethBattle_turn_protect_v1")||"[]")}catch(e){students=[]}if(!students.length){students=defaultNames.map((n,i)=>makeStudent(n,i,i<8))}students.forEach((s,i)=>{if(typeof s.max==="undefined")s.max=10;if(typeof s.teeth==="undefined")s.teeth=s.max;if(typeof s.hitStreak==="undefined")s.hitStreak=0;if(typeof s.protect==="undefined")s.protect=false;if(typeof s.lastTargetId==="undefined")s.lastTargetId=null;if(!s.color)s.color=colors[i%colors.length]})}
function save(){localStorage.setItem("monsterTeethBattle_turn_protect_v1",JSON.stringify(students))}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove("show"),1600)}
function activeStudents(){return students.filter(s=>s.active)}function aliveActive(){return activeStudents().filter(s=>s.teeth>0)}
function currentAttacker(){const alive=aliveActive();if(!alive.length)return null;attackerIndex=((attackerIndex%alive.length)+alive.length)%alive.length;return alive[attackerIndex]}
function addKid(){const name=prompt("输入新小朋友名字：");if(!name||!name.trim())return;const clean=name.trim();if(students.some(s=>s.name.toLowerCase()===clean.toLowerCase())){alert("这个名字已经有啦");return}students.push(makeStudent(clean,students.length,true));render()}
function resetNames(){if(confirm("恢复默认名单会清空当前牙齿状态，确定吗？")){students=defaultNames.map((n,i)=>makeStudent(n,i,i<8));attackerIndex=0;render()}}
function toggle(id){const s=students.find(x=>x.id===id);if(!s)return;s.active=!s.active;attackerIndex=0;render();if(document.getElementById("battleScreen").classList.contains("show"))renderBattle()}
function selectAll(){students.forEach(s=>s.active=true);attackerIndex=0;render()}function selectNone(){students.forEach(s=>s.active=false);attackerIndex=0;render()}
function startBattle(){const active=activeStudents();if(!active.length){alert("先点选本轮参加PK的小朋友");return}document.getElementById("selectScreen").classList.add("hide");document.getElementById("battleScreen").classList.add("show");ensureAttacker();renderBattle()}
function backSelect(){document.getElementById("battleScreen").classList.remove("show");document.getElementById("selectScreen").classList.remove("hide");render()}
function ensureAttacker(){const alive=aliveActive();if(!alive.length){attackerIndex=0;return}if(attackerIndex>=alive.length)attackerIndex=0}
function nextAttacker(){const alive=aliveActive();if(alive.length<=1){toast("暂时没有下一个攻击者");return}attackerIndex=(attackerIndex+1)%alive.length;renderBattle()}
function nextAttackerSilent(){const alive=aliveActive();if(alive.length>1)attackerIndex=(attackerIndex+1)%alive.length}
function attackTarget(targetId){const target=students.find(s=>s.id===targetId);const attacker=currentAttacker();if(!target||!target.active)return;if(!attacker){toast("没有可攻击的小朋友");return}if(target.id===attacker.id){toast("不能攻击自己的怪兽");return}if(target.teeth<=0){toast(target.name+" 已进入 Sleep Mode");return}if(attacker.lastTargetId===target.id){toast(attacker.name+" 不能连续攻击同一个目标");return}if(target.protect){target.protect=false;target.hitStreak=0;attacker.lastTargetId=target.id;toast(target.name+" 开启防护，抵挡了这次攻击！");nextAttackerSilent();renderBattle();render();return}target.teeth=Math.max(0,target.teeth-1);target.hitStreak=(target.hitStreak||0)+1;attacker.lastTargetId=target.id;if(target.teeth===0){target.hitStreak=0;target.protect=false;toast(target.name+" 进入 Sleep Mode")}else if(target.hitStreak>=3){target.hitStreak=0;target.protect=true;toast(target.name+" 连续被打3次，开启一次防护模式！")}nextAttackerSilent();renderBattle();render()}
function fix(id){const s=students.find(x=>x.id===id);if(!s)return;s.teeth=Math.min(s.max,s.teeth+1);renderBattle();render()}
function revive(id){const s=students.find(x=>x.id===id);if(!s)return;s.teeth=Math.min(s.max,Math.max(s.teeth,0)+3);s.hitStreak=0;s.protect=false;ensureAttacker();toast(s.name+" 复活，恢复 3 颗牙");renderBattle();render()}
function full(id){const s=students.find(x=>x.id===id);if(!s)return;s.teeth=s.max;s.hitStreak=0;s.protect=false;renderBattle();render()}
function restoreSelected(){activeStudents().forEach(s=>{s.teeth=s.max;s.hitStreak=0;s.protect=false;s.lastTargetId=null});attackerIndex=0;renderBattle();render()}
function render(){const active=activeStudents();document.getElementById("selectedLine").textContent=`已选择 ${active.length} 人：${active.map(s=>s.name).join("、")}`;document.getElementById("nameGrid").innerHTML=students.map(s=>`<button class="nameBtn ${s.active?'active':''} ${s.teeth===0?'out':''}" onclick="toggle('${s.id}')">${esc(s.name)}</button>`).join("");save()}
function renderBattle(){ensureAttacker();const active=activeStudents();const alive=active.filter(s=>s.teeth>0);const attacker=currentAttacker();document.getElementById("attackerText").textContent=attacker?`轮到：${attacker.name} 攻击`:"本轮结束";document.getElementById("statSelected").textContent=active.length;document.getElementById("statAlive").textContent=alive.length;document.getElementById("statOut").textContent=active.filter(s=>s.teeth===0).length;document.getElementById("statTeeth").textContent=active.reduce((a,b)=>a+b.teeth,0);document.getElementById("battleEmpty").style.display=active.length?"none":"block";const grid=document.getElementById("battleGrid");grid.className="battleGrid"+(active.length===1?" one":active.length<=4?" few":"");grid.innerHTML=active.map(s=>card(s,attacker&&attacker.id===s.id)).join("");save()}
function card(s,isAttacker){const teeth=Array.from({length:s.max},(_,i)=>`<button class="tooth ${i>=s.teeth?'gone':''}" onclick="attackTarget('${s.id}')" title="点击牙齿打掉"></button>`).join("");return `<div class="card ${s.teeth===0?'out':''} ${isAttacker?'attacker':''} ${s.protect?'protect':''}"><div class="cardName"><span>${esc(s.name)}</span><div class="badges"><span class="count">🦷 ${s.teeth}/${s.max}</span>${s.protect?`<span class="shield">🛡 防护</span>`:`<span class="streak">${s.hitStreak||0}/3</span>`}</div></div><div class="monsterBox"><div class="monster" style="--c:${s.color}"><div class="horn l"></div><div class="horn r"></div><div class="eye l"></div><div class="eye r"></div><div class="mouth">${teeth}</div></div><div class="sleep">Sleep Mode</div><div class="protectLabel">防护中</div></div><div class="actions"><button class="smallBtn fix" onclick="fix('${s.id}')">补一颗牙</button><button class="smallBtn revive" onclick="revive('${s.id}')">复活 +3</button><button class="smallBtn" onclick="full('${s.id}')">满牙</button></div></div>`}
function esc(str){return String(str).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
load();render();
</script>
</body>
</html>
